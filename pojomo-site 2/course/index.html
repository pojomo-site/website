<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reading Speed 500 | Pojomo</title>
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff6b1a;--orange-dark:#e85a0c;--sun:#ffc530;--lotus:#ff5c93;--rice:#16b88a;--indigo:#2a1b5c;--ink:#2a1b5c;--soft:#5b5378;--tint:#fff4ec;--line:#ece7f4;--bg:#fbf9fe;--display:'Unbounded','Arial Black',sans-serif;--body:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:1000px;margin:0 auto;padding:0 1.25rem;height:68px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.top img{height:36px;width:auto;display:block}
.top a.back{font-weight:800;text-decoration:none;color:var(--soft);font-size:.95rem}
.top a.back:hover{color:var(--orange-dark)}
main{max-width:1000px;margin:0 auto;padding:2rem 1.25rem 4rem}
h1,h2,h3{font-family:var(--display);line-height:1.15;letter-spacing:-.01em;margin:0 0 .6rem}
h1{font-size:clamp(1.7rem,4vw,2.5rem)}
h2{font-size:1.35rem}
.vi{display:block;color:var(--soft);font-size:.92rem;font-weight:600;margin-top:.15rem}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:1.6rem;box-shadow:0 6px 24px rgba(42,27,92,.05)}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:999px;padding:.8rem 1.4rem;font-weight:800;font-size:1rem;text-decoration:none}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-dark)}
.btn-soft{background:var(--tint);color:var(--orange-dark)}.btn-soft:hover{background:#ffe6d3}
.btn-indigo{background:var(--indigo);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--soft)}
.credit{font-size:.85rem;color:var(--soft);margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1rem}
/* gate */
.gate{max-width:440px;margin:4rem auto;text-align:center}
.gate input{width:100%;padding:.9rem 1.1rem;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:1.05rem;margin:1rem 0 .8rem;text-align:center}
.gate input:focus{outline:none;border-color:var(--orange)}
.err{color:#c62828;font-weight:700;min-height:1.5em}
/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:1.5rem;align-items:start;margin-bottom:1.5rem}
.steps{margin:.4rem 0 0;padding-left:1.2rem}
.steps li{margin:.3rem 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:.6rem 0 1rem}
.stat{background:var(--tint);border-radius:16px;padding:.8rem;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--orange-dark)}
.stat span{font-size:.8rem;color:var(--soft);font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem}
.day{text-decoration:none;background:#fff;border:2px solid var(--line);border-radius:18px;padding:.9rem 1rem;text-align:left;color:var(--ink);transition:border-color .15s,transform .15s}
.day:hover{border-color:var(--orange);transform:translateY(-2px)}
.day .n{font-weight:800;font-size:.8rem;color:var(--orange-dark);text-transform:uppercase;letter-spacing:.04em}
.day .t{display:block;font-weight:800;line-height:1.25;margin:.2rem 0 .4rem}
.day .r{font-size:.82rem;color:var(--soft);font-weight:700}
.day.done{border-color:#bfeedd;background:#f3fcf8}
.day.done .n{color:var(--rice)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:1rem;font-size:.82rem;font-weight:700;color:var(--soft);margin-top:.3rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
/* lesson */
.crumb.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:.6rem 0}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.timer{font-family:var(--display);font-size:1.3rem;background:var(--indigo);color:#fff;border-radius:999px;padding:.35rem 1rem;min-width:6.5rem;text-align:center}
.passage{font-size:1.2rem;line-height:1.75;max-width:66ch}
.passage p{margin:0 0 1rem}
.result{display:flex;gap:1rem;flex-wrap:wrap;margin:.5rem 0 1.2rem}
.pill{background:var(--tint);border-radius:999px;padding:.45rem 1rem;font-weight:800}
.q{margin:0 0 1.2rem}
.q p{font-weight:800;margin:0 0 .45rem}
.opt{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);border-radius:14px;padding:.55rem .8rem;margin:.35rem 0;cursor:pointer;background:#fff}
.opt:hover{border-color:#ffd2b5}
.opt input{accent-color:var(--orange);width:18px;height:18px}
.opt.right{border-color:var(--rice);background:#effbf6}
.opt.wrong{border-color:#ef5350;background:#fff1f1}
.score{font-family:var(--display);font-size:2rem;color:var(--orange-dark)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
.note{background:#fff8e1;border-radius:14px;padding:.8rem 1rem;font-weight:600;margin:1rem 0}
@media (max-width:760px){.hero{grid-template-columns:1fr}.passage{font-size:1.1rem}.card{padding:1.2rem}}
</style>
</head>

const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
async function sendOne(rec){
  await fetch(ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(rec)});
}
async function flushQueue(){
  const q = store.get(QKEY, []); if(!q.length || !/^https?:/.test(ENDPOINT)) return;
  const left = [];
  for(const rec of q){ try{ await sendOne(rec); }catch(e){ left.push(rec); } }
  store.set(QKEY, left);
}
function record(rec){
  const q = store.get(QKEY, []); q.push(rec); store.set(QKEY, q); flushQueue();
}
let LESSONS = [];
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { const m = Math.floor(s/60), r = Math.floor(s%60); return m + ':' + String(r).padStart(2,'0'); };
let tick = null;

async function unlock(pw, silent){
  try{
    LESSONS = await decrypt(pw);
    store.sset('pojomo-rs500-pw', pw);
    route();
  }catch(e){
    if(!silent) document.getElementById('err').textContent = 'That password is not right. / Mật khẩu chưa đúng.';
  }
}
document.getElementById('gform').addEventListener('submit', e => { e.preventDefault(); unlock(document.getElementById('pw').value.trim()); });
const saved = store.sget('pojomo-rs500-pw'); if(saved) unlock(saved, true);
window.addEventListener('hashchange', () => { if(LESSONS.length) route(); });

function route(){
  clearInterval(tick);
  if(!validEmail(getEmail())){ showEmail(); return; }
  flushQueue();
  const m = location.hash.match(/^#day-(\d+)$/);
  const n = m ? +m[1] : 0;
  if(n >= 1 && n <= LESSONS.length) showStart(n); else showHome();
  window.scrollTo(0, 0);
}

function showEmail(){
  app.innerHTML = `
  <section class="gate card">
    <h1>Before you start</h1>
    <p class="muted">Enter your email address. We save your reading speed and quiz scores so your teacher can follow your progress.<span class="vi">Nhập địa chỉ email của bạn. Chúng tôi lưu tốc độ đọc và điểm bài kiểm tra để giáo viên theo dõi sự tiến bộ của bạn.</span></p>
    <form id="eform" autocomplete="on">
      <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-label="Email address" value="${esc(getEmail())}">
      <div class="err" id="eerr" role="alert"></div>
      <button class="btn btn-primary" type="submit">Start the course</button>
    </form>
    <p class="muted" style="font-size:.85rem;margin-top:1rem">Your email is only used by Pojomo for this course. Write to hello@pojomo.com to have your results deleted.<span class="vi">Email của bạn chỉ được Pojomo dùng cho khóa học này. Gửi thư tới hello@pojomo.com nếu muốn xóa kết quả.</span></p>
  </section>`;
  document.getElementById('eform').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('em').value.trim().toLowerCase();
    if(!validEmail(v)){ document.getElementById('eerr').textContent = 'Please enter a valid email. / Vui lòng nhập email hợp lệ.'; return; }
    store.set(EKEY, v); route();
  });
}

function chart(results){
  const W = 640, H = 220, pad = 34, n = 20;
  const xs = i => pad + i * (W - pad*2) / (n - 1);
  const maxW = Math.min(800, Math.max(300, ...Object.values(results).map(r => r.wpm)));
  const ys = v => H - pad - (Math.min(v, maxW) / maxW) * (H - pad*2);
  let bars = '', pts = [], dots = '', labels = '';
  for(let i = 0; i < n; i++){
    const r = results[i+1];
    labels += `<text x="${xs(i)}" y="${H-10}" font-size="11" text-anchor="middle" fill="#8a83a3">${i+1}</text>`;
    if(r){
      const bh = (r.score/8) * (H - pad*2) * .45;
      bars += `<rect x="${xs(i)-7}" y="${H-pad-bh}" width="14" height="${bh}" rx="3" fill="#ffc530" opacity=".85"><title>Day ${i+1}: ${r.score}/8</title></rect>`;
      pts.push(`${xs(i)},${ys(r.wpm)}`);
      dots += `<circle cx="${xs(i)}" cy="${ys(r.wpm)}" r="5" fill="#ff6b1a"><title>Day ${i+1}: ${r.wpm} wpm</title></circle>`;
    }
  }
  const grid = [100,200,300,400,500].filter(v => v <= maxW).map(v => `<line x1="${pad}" x2="${W-pad}" y1="${ys(v)}" y2="${ys(v)}" stroke="#ece7f4"/><text x="${pad-6}" y="${ys(v)+4}" font-size="10" text-anchor="end" fill="#8a83a3">${v}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reading speed and quiz scores by day">${grid}${bars}<polyline points="${pts.join(' ')}" fill="none" stroke="#ff6b1a" stroke-width="3" stroke-linejoin="round"/>${dots}${labels}</svg>
  <div class="legend"><span><i style="background:#ff6b1a"></i>Words per minute</span><span><i style="background:#ffc530"></i>Quiz score (out of 8)</span></div>`;
}

function showHome(){
  const results = store.get(KEY, {});
  const done = Object.keys(results).length;
  const vals = Object.values(results);
  const best = vals.length ? Math.max(...vals.map(r => r.wpm)) : 0;
  const avg = vals.length ? Math.round(vals.reduce((a, r) => a + r.score, 0) / vals.length * 12.5) : 0;
  const next = LESSONS.find(l => !results[l.n]) || LESSONS[0];
  app.innerHTML = `
  <div class="hero">
    <div>
      <h1>Reading Speed 500</h1>
      <p class="muted">Twenty short stories, one a day, written with the 500 most common English words. Read fast, then answer from memory. Watch your speed grow.<span class="vi">Hai mươi truyện ngắn, mỗi ngày một truyện, viết bằng 500 từ tiếng Anh thông dụng nhất. Đọc thật nhanh, rồi trả lời theo trí nhớ.</span></p>
      <ol class="steps">
        <li>Press <b>Start reading</b>. The timer starts. <span class="vi">Bấm “Start reading”, đồng hồ bắt đầu chạy.</span></li>
        <li>Read as fast as you can, then press <b>I've finished</b>. <span class="vi">Đọc nhanh nhất có thể, rồi bấm “I've finished”.</span></li>
        <li>Answer 8 questions without looking back. <span class="vi">Trả lời 8 câu hỏi mà không xem lại bài.</span></li>
      </ol>
      <div class="note">Aim for about 6 out of 8. If you get 8 out of 8 every time, try reading faster!<span class="vi">Mục tiêu khoảng 6/8. Nếu lần nào cũng đúng 8/8, hãy thử đọc nhanh hơn!</span></div>
      <a class="btn btn-primary" href="#day-${next.n}">${done ? 'Continue: Day ' + next.n : 'Start Day 1'}</a>
      <p class="muted" style="font-size:.88rem;margin-top:.8rem">Saving results for <b>${esc(getEmail())}</b> · <a href="#" id="chg">change</a></p>
    </div>
    <div class="card">
      <h2>Your progress</h2>
      <div class="stats"><div class="stat"><b>${done}/20</b><span>days done</span></div><div class="stat"><b>${best || '–'}</b><span>best wpm</span></div><div class="stat"><b>${vals.length ? avg + '%' : '–'}</b><span>avg score</span></div></div>
      ${chart(results)}
    </div>
  </div>
  <h2>All 20 days</h2>
  <div class="days" id="days">${LESSONS.map(l => { const r = results[l.n]; return `<a class="day${r ? ' done' : ''}" href="#day-${l.n}"><span class="n">Day ${l.n}${r ? ' ✓' : ''}</span><span class="t">${esc(l.title)}</span><span class="r">${r ? r.wpm + ' wpm · ' + r.score + '/8' : l.words + ' words'}</span></a>`; }).join('')}</div>`;
}

document.addEventListener('click', e => { if(e.target && e.target.id === 'chg'){ e.preventDefault(); store.set(EKEY, ''); showEmail(); } });

function showStart(n){
  const l = LESSONS[n-1];
  const prev = store.get(KEY, {})[n];
  app.innerHTML = `
  <div class="crumb"><a class="btn btn-soft" href="#">← All days</a></div>
  <div class="card">
    <p class="muted" style="margin:0;font-weight:800">Day ${n} of 20 · ${l.words} words</p>
    <h1>${esc(l.title)}</h1>
    ${prev ? `<p class="muted">Last time: ${prev.wpm} words per minute, ${prev.score}/8. You can try again.<span class="vi">Lần trước: ${prev.wpm} từ/phút, ${prev.score}/8. Bạn có thể làm lại.</span></p>` : ''}
    <p>When you press the button, the story appears and the timer starts. Read quickly, but make sure you understand.<span class="vi">Khi bạn bấm nút, câu chuyện sẽ hiện ra và đồng hồ bắt đầu chạy. Đọc nhanh nhưng phải hiểu.</span></p>
    <button class="btn btn-primary" id="go">Start reading</button>
  </div>`;
  document.getElementById('go').onclick = () => showRead(n);
}

function showRead(n){
  const l = LESSONS[n-1];
  const t0 = performance.now();
  app.innerHTML = `
  <div class="crumb sticky"><span class="muted" style="font-weight:800">Day ${n} · ${esc(l.title)}</span><span class="timer" id="tm">0:00</span></div>
  <div class="card"><div class="passage">${l.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>
  <button class="btn btn-indigo" id="fin">I've finished / Tôi đã đọc xong</button></div>`;
  tick = setInterval(() => { document.getElementById('tm').textContent = fmt((performance.now() - t0) / 1000); }, 250);
  document.getElementById('fin').onclick = () => {
    clearInterval(tick);
    const secs = Math.max(1, (performance.now() - t0) / 1000);
    showQuiz(n, secs);
  };
}

function showQuiz(n, secs){
  const l = LESSONS[n-1];
  const wpm = Math.round(l.words * 60 / secs);
  app.innerHTML = `
  <div class="crumb"><a class="btn btn-soft" href="#">← All days</a><span class="muted" style="font-weight:800">Day ${n} · ${esc(l.title)}</span></div>
  <div class="card">
    <div class="result"><span class="pill">Time: ${fmt(secs)}</span><span class="pill">Speed: ${wpm} words per minute</span></div>${wpm > 600 ? `<div class="note">That was very fast! Did you read the whole story? If not, press ← All days and try again.<span class="vi">Bạn đọc rất nhanh! Bạn đã đọc hết câu chuyện chưa? Nếu chưa, hãy quay lại và đọc lại.</span></div>` : ""}
    <h2>Answer from memory</h2>
    <p class="muted">Don't go back to the story.<span class="vi">Không xem lại câu chuyện.</span></p>
    <form id="qz">${l.questions.map((q, i) => `
      <fieldset class="q" style="border:0;padding:0"><p>${i+1}. ${esc(q.q)}</p>
      ${q.opts.map((o, j) => `<label class="opt" data-q="${i}" data-o="${j}"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</fieldset>`).join('')}
      <button class="btn btn-primary" type="submit" id="sub" disabled>Check my answers</button>
    </form>
  </div>`;
  const form = document.getElementById('qz');
  form.addEventListener('change', () => { document.getElementById('sub').disabled = l.questions.some((_, i) => !form.querySelector(`input[name=q${i}]:checked`)); });
  form.addEventListener('submit', e => {
    e.preventDefault();
    let score = 0;
    l.questions.forEach((q, i) => {
      const picked = +form.querySelector(`input[name=q${i}]:checked`).value;
      if(picked === q.answer) score++;
      form.querySelectorAll(`label[data-q="${i}"]`).forEach(lab => {
        const j = +lab.dataset.o;
        if(j === q.answer) lab.classList.add('right'); else if(j === picked) lab.classList.add('wrong');
        lab.querySelector('input').disabled = true;
      });
    });
    const results = store.get(KEY, {});
    results[n] = {wpm, score, secs: Math.round(secs), date: new Date().toISOString().slice(0, 10)};
    store.set(KEY, results);
    record({email: getEmail(), day: n, story: l.title, secs: Math.round(secs), wpm, score});
    const msg = score === 8 ? 'Perfect! Next time, try to read a little faster.' : score >= 6 ? 'Great balance of speed and understanding.' : 'Try reading a little more carefully next time.';
    const msgVi = score === 8 ? 'Hoàn hảo! Lần sau hãy thử đọc nhanh hơn một chút.' : score >= 6 ? 'Rất tốt, vừa nhanh vừa hiểu.' : 'Lần sau hãy đọc kỹ hơn một chút.';
    document.getElementById('sub').outerHTML = `
      <div class="note" style="background:var(--tint)"><span class="score">${score}/8</span> · ${wpm} wpm<br>${msg}<span class="vi">${msgVi}</span></div>
      <div class="row">${n < 20 ? `<a class="btn btn-primary" href="#day-${n+1}">Next: Day ${n+1}</a>` : ''}<a class="btn btn-soft" href="#">See my progress</a><a class="btn btn-soft" href="#day-${n}" id="again">Try again</a></div>`;
    document.getElementById('again').onclick = e2 => { e2.preventDefault(); showStart(n); };
  });
}
</script>
</body>
</html>
